version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cue_user:cue_pass@db:5432/cue_masters
      - JWT_SECRET=cue_masters_secret_jwt_key_2026
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-placeholder}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=cue_user
      - POSTGRES_PASSWORD=cue_pass
      - POSTGRES_DB=cue_masters
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
